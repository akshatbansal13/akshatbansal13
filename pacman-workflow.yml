name: generate arcade contribution graphs

on:
  schedule: # Run automatically every 24 hours
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab
  push: # Runs on every push to the main branch
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Comma-separated list of game names to generate. This repo's README only uses "pacman".
          games: 'pacman'
          # Omit the month labels row above the grid.
          hide_month_labels: 'false'

      # Push the generated SVGs to the output branch, which the README reads from
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
